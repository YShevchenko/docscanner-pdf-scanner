name: docscanner_app
description: "DocScan — Privacy-first PDF scanner with OCR and full-text search."
publish_to: 'none'

version: 1.0.10+10

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Document scanning (native edge detection + perspective correction)
  cunning_document_scanner: ^1.0.1
  # OCR - on-device text recognition
  google_mlkit_text_recognition: ^0.13.0
  # PDF generation
  pdf: ^3.11.1
  printing: ^5.13.2
  # Image processing (filters)
  image: ^4.2.0
  # Database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  # State management
  provider: ^6.1.4
  # File sharing
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  wakelock_plus: ^1.2.10
  torch_light: ^1.1.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#1E3A5F"
  android: true
  ios: true

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
